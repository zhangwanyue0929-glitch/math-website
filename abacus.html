<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>算盘互动 - 算经千年</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/abacus.css">
</head>
<body>
<header class="navbar">
    <a class="logo" href="index.html">算经千年</a>
    <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <nav aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="history.html">发展史</a>
        <a href="mathematicians.html">数学家</a>
        <a href="classics.html">数学经典</a>
        <a class="active" href="abacus.html">算盘互动</a>
        <a href="puzzle.html">华容道</a>
    </nav>
</header>

<main class="abacus-page page-pattern">
    <section class="abacus-intro">
        <p class="eyebrow">上二下五，靠梁为数</p>
        <h1>拨一拨传统算盘</h1>
        <p>点击或拖动珠子，让它们向中梁靠拢。上珠每颗记五，下珠每颗记一；同一档满十后向左一档进位。</p>
    </section>

    <section class="abacus-workbench">
        <div class="abacus-hint">
            <strong>互动提示</strong>
            <span>点击珠子拨入或拨出；拖动靠近中梁会自动吸附。窄屏可以左右滑动，看完全部档位。</span>
        </div>

        <div class="abacus-scroll">
            <div class="abacus-stage" aria-label="传统二五珠算盘">
                <img class="abacus-body" src="assets/images/abacus/abacus-body-paper.png" alt="">
                <div id="abacusBeads"></div>
            </div>
        </div>

        <aside class="abacus-panel">
            <div>
                <span>当前读数</span>
                <output id="abacusValue">0</output>
            </div>
            <p id="placeText">各档均未拨入。</p>
            <button id="resetAbacus" type="button">清盘</button>
        </aside>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/abacus.js"></script>
<script src="js/particle.js"></script>
</body>
</html>
