        <p class="eyebrow">以形释数，以数明理</p>
        <h1>古代数学经典馆</h1>
        <p>从直角三角形到组合数列，从割圆逼近到圆周率，把知识讲解和互动演示放在同一个页面里。</p>
    </section>

    <section class="classic-container">
        <aside class="classic-menu" aria-label="数学经典选择">
            <button class="classic-btn active" data-classic="gougu" type="button">
                <strong>勾股定理</strong>
                <span>直角三角形的测量法</span>
            </button>
            <button class="classic-btn" data-classic="yanghui" type="button">
                <strong>杨辉三角</strong>

                <span>以多边形逼近圆</span>
            </button>
        </aside>

        <section class="classic-content">
            <div class="classic-header">
                <span id="classic-kicker">中国古代数学实验</span>
                <h2 id="classic-title">勾股定理</h2>
                <p id="classic-text"></p>
            </div>
            <div class="classic-grid">
                <div id="demo-container"></div>
                <article class="classic-article">
                    <h3>史料原文</h3>
                    <p id="classic-source-note"></p>
                    <blockquote id="classic-source"></blockquote>
                    <h3>现代释义</h3>

                    <ul id="classic-points"></ul>
                    <h3>辅助演示</h3>
                    <p class="demo-label">左侧图形由本馆用 SVG 或数表画出，用来看数量关系，不是古籍原图。</p>
                    <p><a id="classic-book" href="classic-jiuzhang.html">阅读相关典籍</a></p>
