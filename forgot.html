    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="forgot">
<header class="navbar">
    <a class="logo" href="index.html">算经千年</a>
    <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <nav aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="history.html">发展史</a>
        <a href="mathematicians.html">数学家</a>
        <a href="classics.html">数学经典</a>
        <a href="abacus.html">算盘互动</a>
        <a href="puzzle.html">华容道</a>
        <a class="nav-minor" href="board.html">留言</a>
        <a class="nav-minor" href="survey.html">调查</a>
        <a class="nav-minor active" href="login.html" data-nav-account>登录</a>
    </nav>
</header>
<main class="plain-page page-plain">
    <div class="auth-wrap">
        <section class="auth-card">
            <h1>找回密码</h1>
            <p class="help">先填写用户名。系统只在本机核对注册时留下的密保，不发送邮件。</p>
            <form>
                <label class="field">用户名<input name="username" type="text" autocomplete="username" required maxlength="16"></label>
                <div id="resetFields" hidden>
                    <p id="questionText" class="summary"></p>
                    <label class="field">密保答案<input name="answer" type="text" maxlength="20"></label>
                    <label class="field">新密码<input name="newPassword" type="password" autocomplete="new-password"></label>
                </div>
                <p id="formError" class="form-error" role="alert"></p>
                <button class="btn" type="submit">继续</button>
            </form>
            <p class="switch-link"><a href="login.html">返回登录</a></p>
        </section>
    </div>
</main>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/account.js"></script>
</body>
</html>
