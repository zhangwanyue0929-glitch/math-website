        <span></span><span></span><span></span>

<main class="history-page page-plain">
    <header class="history-title">
        <h1>中国数学发展史</h1>
        <p>穿越千年文明，探索东方数学智慧</p>
    </header>

    <div class="timeline-wrap">
        <div class="timeline" role="group" aria-label="数学发展时间轴">
            <button class="history-card" type="button" data-era="xia" aria-pressed="false">夏商周</button>
            <span class="era-arrow" aria-hidden="true">→</span>
            <button class="history-card" type="button" data-era="han" aria-pressed="false">汉代</button>
            <span class="era-arrow" aria-hidden="true">→</span>
            <button class="history-card" type="button" data-era="wei" aria-pressed="false">魏晋</button>
            <span class="era-arrow" aria-hidden="true">→</span>
            <button class="history-card" type="button" data-era="nanbei" aria-pressed="false">南北朝</button>
            <span class="era-arrow" aria-hidden="true">→</span>
            <button class="history-card" type="button" data-era="songyuan" aria-pressed="false">宋元</button>
        </div>
    </div>

    <section id="historyDetail" class="history-detail" aria-live="polite">
        <h2>点击时间节点查看介绍</h2>
        <p>示例：汉代《九章算术》形成，中国古代数学体系逐渐完善。</p>
    </section>
</main>

<script src="js/api.js"></script>
