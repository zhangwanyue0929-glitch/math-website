<main class="plain-page page-plain">
    <div class="auth-wrap">
        <section class="auth-card">
            <h1>登录</h1>
            <p class="help">登录后可以收藏展项、发表留言、填写调查，并在个人中心查看记录。</p>
            <form>
                <label class="field">用户名<input name="username" type="text" autocomplete="username" required maxlength="16"></label>
                <label class="field">密码<input name="password" type="password" autocomplete="current-password" required></label>
                <p id="formError" class="form-error" role="alert"></p>
                <button class="btn" type="submit">登录</button>
            </form>
            <p class="switch-link"><a href="register.html">没有账号，去注册</a> · <a href="forgot.html">忘记密码</a></p>
        </section>
    </div>
</main>
