<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华容道 - 算经千年</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/puzzle.css">
</head>
<body>
<header class="navbar">
    <div class="logo">算经千年</div>
    <nav>
        <a href="index.html">首页</a>
        <a href="history.html">发展史</a>
        <a href="mathematicians.html">数学家</a>
        <a href="classics.html">数学经典</a>
        <a href="abacus.html">算盘互动</a>
        <a class="active" href="puzzle.html">华容道</a>
    </nav>
</header>

<main class="puzzle">
    <section class="puzzle-copy">
        <p class="eyebrow">移形换位，步步有数</p>
        <h1>智破华容道</h1>
        <p>拖动人物棋子到相邻空格。横将只能横向移动，竖将只能纵向移动，曹操抵达底部中间出口即通关。</p>
    </section>

    <section class="puzzle-layout">
        <div id="board" aria-label="华容道棋盘"></div>
        <aside class="puzzle-panel">
            <div class="counter">
                <span>步数</span>
                <strong id="moveCount">0</strong>
            </div>
            <p id="win">拖动棋子开始挑战。空格在棋盘底部两侧，先为曹操让出向下通道。</p>
            <button id="restartPuzzle" type="button">重新开始</button>
        </aside>
    </section>
</main>

<script src="js/puzzle.js"></script>
<script src="js/particle.js"></script>
</body>
</html>
