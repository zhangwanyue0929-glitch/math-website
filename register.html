<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>注册 - 算经千年</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="register">
<header class="navbar">
    <a class="logo" href="index.html">算经千年</a>
    <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <nav aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="history.html">发展史</a>
        <a href="mathematicians.html">数学家</a>
        <a href="classics.html">数学经典</a>
        <a href="abacus.html">算盘互动</a>
        <a href="puzzle.html">华容道</a>
        <a class="nav-minor" href="board.html">留言</a>
        <a class="nav-minor" href="survey.html">调查</a>
        <a class="nav-minor active" href="login.html" data-nav-account>登录</a>
    </nav>
</header>
<main class="plain-page page-plain">
    <div class="auth-wrap">
        <section class="auth-card">
            <h1>注册</h1>
            <p class="help">密码至少 8 位，并且同时有字母和数字。密保用于找回密码，答案不会显示给管理员。</p>
            <form>
                <label class="field">用户名<input name="username" type="text" autocomplete="username" required maxlength="16"></label>
                <label class="field">邮箱<input name="email" type="email" autocomplete="email" required maxlength="120"></label>
                <label class="field">密码<input name="password" type="password" autocomplete="new-password" required></label>
                <label class="field">密保问题<input name="securityQuestion" type="text" required maxlength="40" placeholder="例如：本馆的馆名是什么"></label>
                <label class="field">密保答案<input name="securityAnswer" type="text" required maxlength="20"></label>
                <p id="formError" class="form-error" role="alert"></p>
                <button class="btn" type="submit">注册并登录</button>
            </form>
            <p class="switch-link"><a href="login.html">已有账号，去登录</a></p>
        </section>
    </div>
</main>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/account.js"></script>
</body>
</html>
